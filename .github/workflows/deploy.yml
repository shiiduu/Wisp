name: Deploy to GitHub Pages

# Deploys ONLY on an explicit "deploy-*" tag push (e.g. deploy-v1,
# deploy-2024-01), or a manual run. Plain pushes to any branch —
# including Mockup — never trigger this workflow.
on:
  push:
    tags:
      - 'deploy-*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing
        run: pnpm --filter @wisp/landing build

      - name: Build mockup
        run: pnpm --filter @wisp/mockup build

      - name: Assemble site (landing at root, mockup at /mockup)
        run: node scripts/assemble-site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
